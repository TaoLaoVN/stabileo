name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          BASE_PATH: /

      - name: Verify standalone Mahung.Space build
        working-directory: web
        run: |
          test -f dist/index.html || { echo 'index.html missing'; exit 1; }
          test -f dist/404.html || { echo '404.html missing'; exit 1; }
          test -f dist/CNAME || { echo 'CNAME missing'; exit 1; }
          grep -q '^stabileo.mahung.space$' dist/CNAME || { echo 'CNAME is not stabileo.mahung.space'; exit 1; }
          grep -q 'Mahung Structural Lab' dist/index.html || { echo 'Mahung brand metadata missing'; exit 1; }
          grep -q 'https://stabileo.mahung.space/' dist/index.html || { echo 'Mahung canonical URL missing'; exit 1; }
          ls dist/assets/dedaliano_engine_bg-*.wasm >/dev/null || { echo 'WASM engine asset missing'; exit 1; }

          echo "standalone Mahung.Space build verified"

      - name: Verify custom-domain asset paths
        working-directory: web
        run: |
          test -f dist/index.html
          if grep -Eq '="/stabileo/|='\''/stabileo/'\''' dist/index.html; then
            echo "GitHub Pages build emitted /stabileo asset paths on the custom domain."
            echo "Expected root-relative paths like /assets/... for stabileo.com."
            exit 1
          fi
          if ! grep -Eq 'src="/assets/|href="/assets/' dist/index.html; then
            echo "GitHub Pages build did not emit root-relative asset URLs."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
