name: Prebuild WASM artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prebuild-wasm.yml
      - Cargo.toml
      - Cargo.lock
      - engine/**
      - web/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prebuild-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build engine WASM
        working-directory: web
        run: npm run wasm

      - name: Verify frontend build
        working-directory: web
        run: npm run build

      - name: Commit prebuilt WASM artifacts
        run: |
          git add -f web/src/lib/wasm
          if git diff --cached --quiet -- web/src/lib/wasm; then
            echo "No WASM artifact changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update prebuilt WASM artifacts"
          git push
