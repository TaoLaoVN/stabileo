<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!--
      STATIC METADATA — the only metadata a crawler that does not run
      JavaScript ever sees, because the landing is client-rendered. It is
      therefore the English source of truth and must stay correct on its own.
      LandingPage.svelte does not append a second copy of these tags; it
      rewrites them in place after hydration (and back on unmount), so there is
      never a duplicate or a contradiction in the document.
    -->
    <meta
      name="description"
      content="Mahung Structural Lab is a Mahung.Space engineering tool based on Stabileo, the open-source 2D and 3D structural analysis app by LambdaClass."
    />
    <meta name="theme-color" content="#0c1620" />
    <link rel="canonical" href="https://stabileo.mahung.space/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mahung Structural Lab" />
    <meta property="og:url" content="https://stabileo.mahung.space/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_AR" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:title" content="Mahung Structural Lab — Structural analysis in Mahung.Space." />
    <meta
      property="og:description"
      content="A Mahung.Space engineering tool based on Stabileo by LambdaClass. Modified source is public and licensed under AGPL-3.0."
    />
    <!--
      Absolute, because crawlers do not reliably resolve relative og:image URLs.
      Safe for the deploy check in .github/workflows/deploy-gh-pages.yml, which
      rejects GitHub project-page asset prefixes on the custom domain; an
      https:// URL is not one. (That check greps the built HTML, so this note
      deliberately avoids spelling the rejected prefix out and tripping it.)
      PNG, because it is the format every crawler accepts; the landing's AVIF
      and WebP derivatives are deliberately not used here.
    -->
    <meta property="og:image" content="https://stabileo.mahung.space/og/stabileo-social.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mahung Structural Lab — structural analysis in Mahung.Space. A simply supported truss with members coloured by axial force: red in tension, blue in compression."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mahung Structural Lab — Structural analysis in Mahung.Space." />
    <meta
      name="twitter:description"
      content="A Mahung.Space engineering tool based on Stabileo by LambdaClass. Modified source is public and licensed under AGPL-3.0."
    />
    <meta name="twitter:image" content="https://stabileo.mahung.space/og/stabileo-social.png" />
    <meta
      name="twitter:image:alt"
      content="Mahung Structural Lab — structural analysis in Mahung.Space. A simply supported truss with members coloured by axial force: red in tension, blue in compression."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>if(location.hostname==='localhost'||location.hostname==='127.0.0.1')document.querySelector('link[rel="icon"]').href='/favicon-dev.svg';</script>
    <title>Mahung Structural Lab — Structural analysis in Mahung.Space.</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
